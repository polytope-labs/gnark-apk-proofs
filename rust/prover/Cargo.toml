[package]
name = "gnark-apk-prover"
version = "0.1.0"
edition = "2021"


[features]
test-utils = ["ark-std"]
# CUDA-accelerated icicle GPU PLONK backend. build.rs builds open-icicle + gnark-cuda from
# source (needs CUDA toolkit + CMake + git); no env vars. Default build stays CPU-only.
cuda = ["gnark-apk-ffi/cuda"]

[dependencies]
gnark-apk-ffi = { path = "../ffi" }
gnark-plonk-verifier = { path = "../verifier" }
ark-bls12-381 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-std = { version = "0.5", optional = true }
thiserror = "2"

[dev-dependencies]
ark-std = "0.5"
# For the prove_from_json example, which bridges live chain data into a proof.
hex = "0.4"
serde_json = "1"
