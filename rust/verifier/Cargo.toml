[package]
name = "gnark-plonk-verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-bls12-381 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
once_cell = { version = "1", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
std = [
    "ark-bls12-381/std",
    "ark-ec/std",
    "ark-ff/std",
    "ark-serialize/std",
    "sha2/std",
    "sha3/std",
    "thiserror/std",
    "once_cell/std",
]

[dev-dependencies]
gnark-apk-prover = { path = "../prover", features = ["test-utils"] }
ark-std = "0.5"
revm = "36"
alloy-sol-types = "1"
alloy-primitives = "1"
serde_json = "1"
hex = "0.4"
w3f-bls = "0.1.9"
# w3f-bls exposes arkworks 0.4 types; this is the matching ark-serialize used to
# convert them to our 0.5 types without unsound transmutes (audit finding 35).
ark-serialize-04 = { package = "ark-serialize", version = "0.4" }
